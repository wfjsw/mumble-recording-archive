# Example nginx site for Mumble Archive.
#   /        -> the built web UI (web/dist)
#   /data/   -> the bot's public dir (recording.data_dir/public)
# The UI reads catalog/index JSON and fetches audio with HTTP Range requests,
# so nothing but plain static file serving is required.
server {
    listen 80;
    server_name _;

    root /srv/mumble-archive/web;
    index index.html;

    # Hashed assets never change.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        alias /srv/mumble-archive/public/;
        # Index files and today's pack are rewritten/appended continuously:
        # let browsers revalidate (cheap 304s) instead of using stale copies.
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json;
        # Range requests on .pack files work out of the box.
    }

    # Optional: protect the archive.
    # auth_basic "Mumble Archive";
    # auth_basic_user_file /etc/nginx/mumble-archive.htpasswd;
}
