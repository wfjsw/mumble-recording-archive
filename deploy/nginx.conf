# Example nginx site for Mumble Archive.
#   /        -> the built web UI (web/dist)
#   /data/   -> the bot's public dir (recording.data_dir/public)
# The UI reads append-only index logs and audio packs with HTTP Range requests,
# so nothing but plain static file serving is required.

# Files of finished days are requested as "<file>?v=<version>" and never change
# under that URL: cache them. Everything else (meta.json, days.log, the channel
# log, today's index and pack) is live and must be revalidated.
map $arg_v $archive_cache {
    ""      "no-cache";
    default "max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /srv/mumble-archive/web;
    index index.html;

    # Hashed assets never change.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        alias /srv/mumble-archive/public/;
        # Logs and packs grow by appending; the UI reads the new tail with Range
        # requests. Don't gzip them (nginx ignores Range on compressed responses);
        # only meta.json is JSON.
        add_header Cache-Control $archive_cache;
        gzip on;
        gzip_types application/json;
    }

    # Optional: protect the archive.
    # auth_basic "Mumble Archive";
    # auth_basic_user_file /etc/nginx/mumble-archive.htpasswd;
}
